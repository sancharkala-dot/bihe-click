
<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Bihe Click</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid;
      place-items: center; padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #081d43, #174f87);
    }
    .login {
      width: 100%; max-width: 410px; background: white;
      padding: 28px; border-radius: 18px; text-align: center;
      box-shadow: 0 12px 35px #0004;
    }
    .logo { width: 100px; height: 100px; object-fit: contain; }
    h1 { color: #123b70; margin-bottom: 6px; }
    p { color: #666; }
    input, button {
      width: 100%; padding: 13px; margin-top: 12px;
      border-radius: 8px; font-size: 15px;
    }
    input { border: 1px solid #ccc; }
    button {
      border: 0; cursor: pointer; color: white;
      background: #123b70; font-weight: bold;
    }
    .google { background: #4285f4; }
    .facebook { background: #1877f2; }
    .secondary { background: #555; }
    #message { font-size: 14px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="login">
    <img class="logo" src="bihe-click-logo.png" alt="Bihe Click Logo">
    <h1>Bihe Click</h1>
    <p>लगइन गर्नुहोस्</p>

    <form id="loginForm">
      <input id="email" type="email" placeholder="Email ठेगाना" required>
      <input id="password" type="password" placeholder="Password (कम्तीमा ६ अक्षर)" minlength="6" required>
      <button type="submit">Login / Sign in</button>
    </form>

    <button id="signup" class="secondary">नयाँ Account बनाउनुहोस्</button>
    <button id="google" class="google">Google बाट Login</button>
    <button id="facebook" class="facebook">Facebook बाट Login</button>
    <button id="logout" class="secondary" hidden>Logout</button>
    <p id="message">लगइन गर्न आफ्नो विकल्प छान्नुहोस्।</p>
  </main>

  
<script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    GoogleAuthProvider,
    FacebookAuthProvider,
    signInWithPopup,
    signOut
  } from
    "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

  // Firebase Console बाट प्राप्त वास्तविक configuration राख्नुहोस्।
 const firebaseConfig = {

  apiKey: "AIzaSyDHbuNuALD0gk4YyhFk6QGNfluKJR9ce8k",

  authDomain: "bihe-click.firebaseapp.com",

  projectId: "bihe-click",

  storageBucket: "bihe-click.firebasestorage.app",

  messagingSenderId: "766084686587",

  appId: "1:766084686587:web:25ab9510f8f392e9b6465e",

  measurementId: "G-GC4PEHLXMY"

};

  // Initialize Firebase exactly once.
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const googleProvider = new GoogleAuthProvider();
  const facebookProvider = new FacebookAuthProvider();
  const message = document.getElementById("message");

  function showError(error) {
    console.error("Firebase Auth error:", error.code, error.message);

    const messages = {
      "auth/invalid-api-key":
        "Firebase API Key गलत छ। Console बाट सही Web App config राख्नुहोस्।",
      "auth/unauthorized-domain":
        "Firebase Authentication मा वेबसाइटको domain अनुमति दिनुहोस्।",
      "auth/operation-not-allowed":
        "Firebase Console मा यो Login provider Enable गर्नुहोस्।",
      "auth/popup-closed-by-user":
        "Login popup बन्द भयो। फेरि प्रयास गर्नुहोस्।",
      "auth/popup-blocked":
        "Browser ले popup रोक्यो। Popup अनुमति दिएर फेरि प्रयास गर्नुहोस्।",
      "auth/invalid-credential":
        "Login विवरण वा provider configuration जाँच गर्नुहोस्।",
      "auth/invalid-email":
        "कृपया सही Email ठेगाना राख्नुहोस्।",
      "auth/weak-password":
        "कम्तीमा ६ अक्षरको बलियो Password राख्नुहोस्।",
      "auth/email-already-in-use":
        "यो Email बाट Account पहिल्यै बनिसकेको छ।",
      "auth/invalid-login-credentials":
        "Email वा Password मिलेन। फेरि जाँच गर्नुहोस्।",
      "auth/account-exists-with-different-credential":
        "यो Email अर्को Login विधिसँग जोडिएको हुन सक्छ।"
    };

    message.textContent =
      messages[error.code] ||
      "Login असफल भयो: " + error.message;
  }

  async function runLogin(action) {
    message.textContent = "Login प्रक्रिया चलिरहेको छ...";

    try {
      await action();
      window.location.href = "gallery.html";
    } catch (error) {
      showError(error);
    }
  }

  // Email / Password Login
  document.getElementById("loginForm")
    .addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      await runLogin(() =>
        signInWithEmailAndPassword(auth, email, password)
      );
    });

  // Create a new account
  document.getElementById("signup").onclick = async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      message.textContent =
        "Account बनाउन Email र Password भर्नुहोस्।";
      return;
    }

    await runLogin(() =>
      createUserWithEmailAndPassword(auth, email, password)
    );
  };

  // Google Login
  document.getElementById("google").onclick = () =>
    runLogin(() => signInWithPopup(auth, googleProvider));

  // Facebook Login
  document.getElementById("facebook").onclick = () =>
    runLogin(() => signInWithPopup(auth, facebookProvider));

  // Logout
  document.getElementById("logout").onclick = async () => {
    try {
      await signOut(auth);
      message.textContent = "Logout भयो।";
    } catch (error) {
      showError(error);
    }
  };

  // Authentication state
  onAuthStateChanged(auth, (user) => {
    document.getElementById("logout").hidden = !user;

    if (user) {
      message.textContent =
        "Login भएको छ: " + (user.email || user.displayName || "User");
    }
  });
</script>

</html>
